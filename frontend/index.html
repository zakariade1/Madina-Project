<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Medina - Authentication</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="./styles.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <h1><i class="fas fa-shield-alt"></i> Medina</h1>
            <p>Secure Authentication</p>
        </div>

        <div id="status" class="status">Checking authentication...</div>

        <div id="auth-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input id="email" type="email" placeholder="Enter your email" required />
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input id="password" type="password" placeholder="Enter your password" required />
                </div>
            </div>

            <div class="button-group">
                <button id="signup" class="btn-primary">
                    <span class="loading"></span>
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
                <button id="signin" class="btn-primary">
                    <span class="loading"></span>
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
                <button id="reset" class="btn-outline">
                    <i class="fas fa-key"></i> Reset Password
                </button>
            </div>
        </div>

        <div id="user-actions" class="hidden">
            <div class="button-group">
                <button id="logout" class="btn-danger">
                    <i class="fas fa-sign-out-alt"></i> Sign Out
                </button>
            </div>
        </div>

        <div id="message"></div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
