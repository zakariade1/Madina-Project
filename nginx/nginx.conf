events {}

http {
  server_tokens off;

  # Talk to Flask (sibling container) over loopback in Cloud Run
  upstream flask_upstream {
    server 127.0.0.1:9000;
    keepalive 64;
  }

  server {
    # Cloud Run provides $PORT at runtime (expanded by entrypoint)
    listen ${PORT};

    # Health endpoint so /healthz is 200
    location = /healthz {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # Optional: make "/" not 404
    location = / {
      return 200 "Nginx is alive\n";
      add_header Content-Type text/plain;
    }

    # Proxy API to Flask
    location /api/ {
      proxy_pass http://flask_upstream;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}