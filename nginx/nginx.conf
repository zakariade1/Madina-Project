events {}

http {
  server_tokens off;

  # talk to Flask in the sibling container
  upstream flask_upstream {
    server 127.0.0.1:9000;
    keepalive 64;
  }

  server {
    # Cloud Run provides $PORT at runtime (expanded via envsubst in entrypoint)
    listen ${PORT};

    # simple 200 for health
    location = /healthz { return 200; }

    # (optional) return something on "/"
    location = / {
      return 200 "OK\n";
      add_header Content-Type text/plain;
    }

    # proxy API to Flask
    location /api/ {
      proxy_pass http://flask_upstream;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}